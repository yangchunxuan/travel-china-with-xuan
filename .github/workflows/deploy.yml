name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Recovery only: full 40-character SHA of a previously verified main release (blank deploys current main)"
        type: string
        required: false
        default: ""
      indexnow_all:
        description: "Also send every sitemap URL to IndexNow, not only new URLs and pages changed in the last two days"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  # Let the post-deploy purge and its delayed second pass finish before a new
  # deployment starts; canceling here could leave old pages cached.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
      rollback: ${{ steps.resolve.outputs.rollback }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve a main release or verified recovery point
        id: resolve
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/resolve-pages-release.mjs
      - name: Check out the validated deployment commit
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: git checkout --detach "$DEPLOY_SHA"
      - name: Capture the previous public sitemap
        # Only a bounded GET, before the build/deploy. A failed or invalid
        # baseline disables new-URL comparison; it never enables a full send.
        continue-on-error: true
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/indexnow-sitemaps"
          mkdir -p "$directory"
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --max-filesize 10485760 --proto '=https' \
            --output "$directory/baseline.tmp" https://homegroundchina.com/sitemap.xml; then
            mv "$directory/baseline.tmp" "$directory/baseline.xml"
          else
            rm -f "$directory/baseline.tmp" "$directory/baseline.xml"
            echo "Previous sitemap unavailable; recent-lastmod selection remains available."
          fi
      - run: npm ci
      - name: Require isolated PostgreSQL checks
        run: |
          set -euo pipefail
          pg_config --bindir >> "$GITHUB_PATH"
          echo 'REQUIRE_ISOLATED_POSTGRES=1' >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Test IndexNow sitemap selection offline
        # A recovery deploy of an older commit has no such test; skip it there.
        run: |
          if [ -f tools/tests/indexnow-sitemap.test.mjs ]; then
            node --test tools/tests/indexnow-sitemap.test.mjs
          else
            echo "This commit predates the IndexNow sitemap test."
          fi
      - name: Test first-party traffic operations
        run: npm run test:traffic-ops
      - name: Test inquiry contract
        run: npm run test:inquiry
      - name: Test guide search
        run: npm run test:guide-search
      - name: Type-check
        run: npx tsc --noEmit
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build static site
        run: npm run build
        env:
          # Public, build-time values only. Unset or incomplete values keep the
          # Inquiry handoff fail-closed; never put server secrets here.
          NEXT_PUBLIC_HOMEGROUND_INQUIRY_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_INQUIRY_ENABLED }}
          NEXT_PUBLIC_HOMEGROUND_HOMEPAGE_EMAIL_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_HOMEPAGE_EMAIL_ENABLED }}
          NEXT_PUBLIC_HOMEGROUND_PRIVATE_TOUR_QUOTE_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVATE_TOUR_QUOTE_ENABLED || 'false' }}
          NEXT_PUBLIC_HOMEGROUND_INQUIRY_API_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_INQUIRY_API_URL }}
          NEXT_PUBLIC_HOMEGROUND_BRAND_EMAIL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_BRAND_EMAIL }}
          NEXT_PUBLIC_HOMEGROUND_PRIVACY_READY: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVACY_READY }}
          NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL }}
          NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_EN: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_EN }}
          NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_ZH: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_ZH }}
          NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_KO: ${{ vars.NEXT_PUBLIC_HOMEGROUND_PRIVACY_NOTICE_URL_KO }}
          NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_EN: ${{ vars.NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_EN }}
          NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_ZH: ${{ vars.NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_ZH }}
          NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_KO: ${{ vars.NEXT_PUBLIC_HOMEGROUND_REPLY_SLA_KO }}
          NEXT_PUBLIC_HOMEGROUND_WHATSAPP_INTAKE_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_WHATSAPP_INTAKE_ENABLED }}
          NEXT_PUBLIC_HOMEGROUND_DIRECT_WHATSAPP_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_DIRECT_WHATSAPP_ENABLED }}
          NEXT_PUBLIC_HOMEGROUND_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_HOMEGROUND_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_HOMEGROUND_MESSENGER_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_MESSENGER_URL }}
          NEXT_PUBLIC_HOMEGROUND_KAKAOTALK_PHONE: ${{ vars.NEXT_PUBLIC_HOMEGROUND_KAKAOTALK_PHONE }}
          NEXT_PUBLIC_HOMEGROUND_FACEBOOK_PAGE_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_FACEBOOK_PAGE_URL }}
          NEXT_PUBLIC_HOMEGROUND_X_PROFILE_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_X_PROFILE_URL }}
          NEXT_PUBLIC_HOMEGROUND_INSTAGRAM_PROFILE_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_INSTAGRAM_PROFILE_URL }}
          NEXT_PUBLIC_HOMEGROUND_YOUTUBE_PROFILE_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_YOUTUBE_PROFILE_URL }}
          # Consent-gated analytics. The shared switch defaults to false, and
          # every destination must be configured explicitly. Missing variables
          # therefore keep collection off; no production identifier or endpoint
          # is supplied by this workflow as an implicit fallback.
          NEXT_PUBLIC_HOMEGROUND_ANALYTICS_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_ANALYTICS_ENABLED || 'false' }}
          NEXT_PUBLIC_HOMEGROUND_NEWSLETTER_ENABLED: ${{ vars.NEXT_PUBLIC_HOMEGROUND_NEWSLETTER_ENABLED || 'false' }}
          NEXT_PUBLIC_HOMEGROUND_NEWSLETTER_API_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_NEWSLETTER_API_URL }}
          NEXT_PUBLIC_HOMEGROUND_GA4_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_HOMEGROUND_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_HOMEGROUND_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_HOMEGROUND_META_PIXEL_ID }}
          NEXT_PUBLIC_HOMEGROUND_WEB_EVENTS_URL: ${{ vars.NEXT_PUBLIC_HOMEGROUND_WEB_EVENTS_URL }}
          # Public project identifiers and a publishable key only. Admin
          # authorization remains server-side (JWT + MFA + UUID allow-list).
          NEXT_PUBLIC_HOMEGROUND_ADMIN_SUPABASE_URL: https://xbymvlxethfzqcgyoieb.supabase.co
          NEXT_PUBLIC_HOMEGROUND_ADMIN_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0xCb0Oh_WNZHpeqx7t2P_A_h2iFFOGx
          NEXT_PUBLIC_HOMEGROUND_ADMIN_INSIGHTS_URL: https://xbymvlxethfzqcgyoieb.supabase.co/functions/v1/admin-insights
          NEXT_PUBLIC_HOMEGROUND_ADMIN_HEALTH_URL: https://xbymvlxethfzqcgyoieb.supabase.co/functions/v1/admin-health
          NEXT_PUBLIC_HOMEGROUND_ADMIN_TRAFFIC_URL: https://xbymvlxethfzqcgyoieb.supabase.co/functions/v1/admin-traffic
      - name: Check ten-day guide export
        run: npm run check:ten-day-guide-export
      - name: Check priority indexable exports
        run: npm run check:indexable-export
      - name: Mark the exact release being published
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const release = {
            schemaVersion: 1,
            commit: process.env.DEPLOY_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            builtAt: new Date().toISOString(),
          };
          await writeFile("out/release.json", JSON.stringify(release) + "\n");
          NODE
      - name: Prepare IndexNow sitemap comparison
        continue-on-error: true
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/indexnow-sitemaps"
          mkdir -p "$directory"
          cp tools/indexnow_sitemap.py "$directory/indexnow_sitemap.py"
          cp out/sitemap.xml "$directory/sitemap.xml"
      - name: Save IndexNow files for the deployment job
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indexnow-sitemaps
          path: ${{ runner.temp }}/indexnow-sitemaps
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always retain the verifier from this workflow revision, including when
      # build checked out a recovery commit that predates the verifier itself.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Refuse to overwrite a newer main release
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA_AT_BUILD: ${{ needs.build.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_main" != "$MAIN_SHA_AT_BUILD" ]]; then
            echo "::error::main advanced while this release was building; deploy current main or choose the recovery point again."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Purge Cloudflare cache after Pages deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is missing}"
          : "${CLOUDFLARE_ZONE_ID:?CLOUDFLARE_ZONE_ID secret is missing}"

          purge_cache() {
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"purge_everything":true}')"
            if ! jq -e '.success == true' <<< "$response" > /dev/null; then
              echo 'Cloudflare cache purge failed' >&2
              return 1
            fi
          }

          purge_cache
          sleep 60
          purge_cache
      - name: Verify the published release and critical pages
        id: live
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
          LIVE_RELEASE_REPORT: live-release-verification.json
        run: node tools/verify-live-release.mjs
      - name: Retain live verification diagnostics
        if: ${{ always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-release-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain the verified recovery point
        if: ${{ success() && steps.live.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ needs.build.outputs.deploy_sha }}
          path: live-release-verification.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Record recovery instructions
        if: ${{ always() }}
        env:
          DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
        run: |
          {
            echo '### Pages release verification and recovery'
            echo "Attempted website commit: \`$DEPLOY_SHA\`."
            echo 'A green deploy requires the matching uncached release marker, six critical pages and their JavaScript assets.'
            echo 'For recovery, open a successful Deploy to GitHub Pages run, find its verified-release-<SHA> artifact, then run this workflow on main with deploy_ref set to that full SHA.'
            echo 'Only unexpired, successful main release artifacts are accepted (90 days). The previous release is rebuilt with current configuration and verified again.'
            echo 'No database, inquiry or DNS changes are made by this recovery. There is no recursive automatic rollback.'
            echo 'Before the first successful verified run, historical commits have no recovery artifact and this shortcut is unavailable.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the build's IndexNow files
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexnow-sitemaps
          path: ${{ runner.temp }}/indexnow-sitemaps
      - name: Tell IndexNow which pages changed
        # Use the validated build sitemap, not a possibly stale CDN copy. The
        # previous live sitemap supplies new-URL detection without inventing
        # lastmod dates. IndexNow receipt is not proof of crawling or indexing.
        # The key is public by design; a failure never fails the deployment.
        continue-on-error: true
        env:
          INDEXNOW_KEY: df33475b7eb248a2bbaa8ff8d55d0b5a
          SUBMIT_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.indexnow_all && 'true' || 'false' }}
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/indexnow-sitemaps"
          python3 "$directory/indexnow_sitemap.py" \
            --current "$directory/sitemap.xml" --baseline "$directory/baseline.xml" \
            --as-of "$(date -u +%F)" --key "$INDEXNOW_KEY" --submit-all "$SUBMIT_ALL" > indexnow.json
          count="$(jq '.urlList | length' indexnow.json)"
          if [ "$count" -eq 0 ]; then
            echo "No new or recently modified canonical sitemap URL; nothing to send."
            exit 0
          fi
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output indexnow-response.txt --write-out '%{http_code}' \
            --request POST --url https://api.indexnow.org/indexnow \
            --header 'Content-Type: application/json; charset=utf-8' --data @indexnow.json)"
          echo "IndexNow answered HTTP ${status} for ${count} URL(s)."
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            cat indexnow-response.txt
            exit 1
          fi
