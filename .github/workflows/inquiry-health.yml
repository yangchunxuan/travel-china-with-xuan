name: Inquiry outbox health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inquiry-outbox-health
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check aggregate outbox health
        env:
          OUTBOX_HEALTH_URL: ${{ vars.OUTBOX_HEALTH_URL }}
          OUTBOX_MONITOR_SECRET: ${{ secrets.OUTBOX_MONITOR_SECRET }}
        run: node tools/check-outbox-health.mjs
      - name: Save successful sample identity without queue contents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outbox-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: outbox-sample.json
          if-no-files-found: error
          retention-days: 7
