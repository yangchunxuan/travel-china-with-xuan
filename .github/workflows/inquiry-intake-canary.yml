name: Inquiry intake canary

# The published site and the Edge Function are deployed by different pipelines,
# so the frontend can start sending a form/privacy version the backend has not
# been told to accept. When that happened on 2026-07-23 every submission was
# rejected with 422 for two and a half days: the traveller saw an error, no row
# was stored, and no notification was sent, so nothing anywhere went red.
#
# This check closes that specific gap. It reads the version the live site
# actually publishes, offers that version to the live endpoint, and fails if the
# endpoint says it does not support it. It needs no secret and no repository
# variable: everything it uses is already public in the deployed page, which
# also means it verifies the site is still pointed at the endpoint it should be.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inquiry-intake-canary
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live site's form version is still accepted
        env:
          SITE_ORIGIN: https://homegroundchina.com
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          bundle="${workdir}/bundle.js"

          if ! curl \
            --silent --show-error --fail \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            --output "${workdir}/index.html" \
            "${SITE_ORIGIN}/"; then
            echo "::error::${SITE_ORIGIN} did not serve its home page. The site \
          is down or unreachable, so nobody can submit an enquiry at all."
            exit 1
          fi

          cat "${workdir}/index.html" > "${bundle}"

          # The version and endpoint live in the built JavaScript, not the HTML.
          chunks="$(
            grep -oE '/_next/static/chunks/[A-Za-z0-9_.-]+\.js' \
              "${workdir}/index.html" | sort -u || true
          )"
          # A single timed-out chunk must not read as an outage, so failures are
          # tolerated individually but counted: if none of them arrive, the
          # missing version below is a network symptom, not an intake one.
          fetched=0
          for chunk in ${chunks}; do
            if curl \
              --silent --show-error --fail \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors \
              "${SITE_ORIGIN}${chunk}" >> "${bundle}"; then
              fetched=$((fetched + 1))
            fi
          done

          # Older supported versions ship alongside the current one; the highest
          # is the one the form submits.
          version="$(
            grep -oE '20[0-9]{2}-[0-1][0-9]-[0-3][0-9]\.[0-9]+' "${bundle}" \
              | sort -V | tail -1 || true
          )"
          endpoint="$(
            grep -oE 'https://[a-z0-9]+\.supabase\.co/functions/v1/v1-inquiries' \
              "${bundle}" | head -1 || true
          )"

          if [[ -z "${version}" ]]; then
            if [[ "${fetched}" -eq 0 ]]; then
              echo "::error::Could not download any of the site's JavaScript \
          (${SITE_ORIGIN}). The site itself may be unreachable; intake was not \
          tested."
            else
              echo "::error::Downloaded the site but found no form version in \
          it. Either the build changed shape or the site is not publishing one; \
          check before assuming intake is healthy."
            fi
            exit 1
          fi

          if [[ -z "${endpoint}" ]]; then
            echo "::error::The published site no longer references an inquiry \
          endpoint. Submissions cannot reach the backend at all."
            exit 1
          fi

          echo "Live site publishes ${version}"

          # Probe all three public submit surfaces with the campaign fields that
          # older cached pages may still send. Required journey, contact and
          # anti-abuse fields stay absent, so the probe cannot be persisted.
          for locale_and_path in "en:/" "zh:/zh/" "ko:/ko/"; do
            locale="${locale_and_path%%:*}"
            landing_path="${locale_and_path#*:}"
            body="$(
              jq -nc \
                --arg v "${version}" \
                --arg locale "${locale}" \
                --arg landingPath "${landing_path}" \
                '{
                  schemaVersion: 2,
                  formVersion: $v,
                  privacyNoticeVersion: $v,
                  entryPath: "destination_timing",
                  locale: $locale,
                  attribution: {
                    landingPath: $landingPath,
                    utmSource: "canary",
                    utmMedium: "scheduled_probe",
                    utmCampaign: "utm-contract"
                  },
                  experiment: null
                }'
            )"

            response_file="${workdir}/response-${locale}.json"
            http_status="$(
              curl \
                --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --retry 2 --retry-all-errors \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Origin: ${SITE_ORIGIN}" \
                --header "Content-Type: application/json" \
                --header "idempotency-key: $(cat /proc/sys/kernel/random/uuid)" \
                --data "${body}" \
                "${endpoint}"
            )"

            error_code="$(jq -r '.error.code // ""' "${response_file}")"
            persistence_state="$(
              jq -r '.error.persistenceState // ""' "${response_file}"
            )"
            contract_errors="$(
              jq -r '
                [
                  (.error.fieldErrors // {} | keys[]) as $field
                  | select(
                      $field == "formVersion"
                      or $field == "privacyNoticeVersion"
                      or $field == "entryPath"
                      or $field == "locale"
                      or $field == "attribution"
                      or ($field | startswith("attribution."))
                    )
                  | $field
                ] | join(",")
              ' "${response_file}"
            )"

            echo "${locale}: HTTP ${http_status}; ${error_code}; ${persistence_state}"

            if [[ "${http_status}" != "422" ||
                  "${error_code}" != "validation_failed" ||
                  "${persistence_state}" != "not_persisted" ]]; then
              echo "::error::Intake is DOWN for ${locale}. Expected a safe \
          422 validation_failed/not_persisted response, but received HTTP \
          ${http_status}, ${error_code:-no error code}, \
          ${persistence_state:-no persistence state}. Check the form/privacy \
          allow-lists, Origin policy and Edge Function health."
              exit 1
            fi

            if [[ -n "${contract_errors}" ]]; then
              echo "::error::Intake rejects fields sent by a live or cached \
          ${locale} form: ${contract_errors}. Campaign-labelled visitors may \
          be unable to submit even though the version itself is accepted."
              exit 1
            fi

            if ! jq -e '
              .error.fieldErrors.journey == "required"
              and .error.fieldErrors.contact == "required"
              and .error.fieldErrors.antiAbuse == "required"
            ' "${response_file}" >/dev/null; then
              echo "::error::The deliberately incomplete ${locale} probe was \
          not rejected for every persistence-critical field. Stop before this \
          monitor can create production enquiries."
              exit 1
            fi
          done

          echo "Intake healthy: ${version} accepts the live UTM contract on en, zh and ko."
