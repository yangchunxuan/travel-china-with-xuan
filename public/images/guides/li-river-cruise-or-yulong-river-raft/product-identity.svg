<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Three products behind the Li River cruise or Yulong River raft question</title>
  <desc id="desc">An editorial comparison separates a large Li River cruise, a Li River electric sightseeing raft and a Yulong River hand-poled raft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0e6"/><stop offset="1" stop-color="#dfece8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173c40" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#173c40">ONE SEARCH PHRASE · THREE PRODUCTS</text>
  <text x="800" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#4c6665">Identify the river, propulsion, boarding point and exit before comparing</text>
  <g filter="url(#shadow)">
    <rect x="80" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#527f91" stroke-width="5"/>
    <rect x="575" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#3a8491" stroke-width="5"/>
    <rect x="1070" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#668657" stroke-width="5"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="305" cy="350" r="82" fill="#527f91"/><path d="M235 357h140l-18 38H253z" fill="#fff"/><rect x="267" y="312" width="76" height="45" rx="8" fill="#fff"/><path d="M278 323h20v17h-20zm34 0h20v17h-20z" fill="#527f91"/>
    <text x="305" y="485" font-size="34" font-weight="700" fill="#244a58">LI RIVER</text><text x="305" y="528" font-size="31" font-weight="700" fill="#244a58">LARGE CRUISE</text>
    <text x="305" y="595" font-size="25" fill="#53686d">Cabin · long corridor</text><text x="305" y="635" font-size="25" fill="#53686d">named port → named pier</text><text x="305" y="710" font-size="22" font-weight="700" fill="#916b34">LI RIVER SYSTEM</text>
    <circle cx="800" cy="350" r="82" fill="#3a8491"/><path d="M720 365h160l-25 34H745z" fill="#fff"/><path d="M760 330h80" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M800 310v55" stroke="#fff" stroke-width="10"/>
    <text x="800" y="485" font-size="34" font-weight="700" fill="#215361">LI RIVER</text><text x="800" y="528" font-size="29" font-weight="700" fill="#215361">ELECTRIC RAFT</text>
    <text x="800" y="595" font-size="25" fill="#53686d">Open · named section</text><text x="800" y="635" font-size="25" fill="#53686d">one-way or round-trip</text><text x="800" y="710" font-size="22" font-weight="700" fill="#916b34">LI RIVER SYSTEM</text>
    <circle cx="1295" cy="350" r="82" fill="#668657"/><path d="M1215 370h160l-24 30h-112z" fill="#fff"/><path d="M1348 290l-95 158" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <text x="1295" y="485" font-size="34" font-weight="700" fill="#3d5c33">YULONG RIVER</text><text x="1295" y="528" font-size="29" font-weight="700" fill="#3d5c33">HAND-POLED RAFT</text>
    <text x="1295" y="595" font-size="25" fill="#53686d">Open · selected wharf</text><text x="1295" y="635" font-size="25" fill="#53686d">route-specific rules</text><text x="1295" y="710" font-size="22" font-weight="700" fill="#55723f">YULONG SYSTEM</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="800" y="885" font-size="30" font-weight="700" fill="#173c40">NOT A MAP · NOT TO SCALE · NOT A TIMETABLE</text><text x="800" y="930" font-size="24" fill="#5f7370">Product identity first; price and availability come from the live official channel</text></g>
</svg>
