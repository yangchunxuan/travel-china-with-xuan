<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">分别核验漓江与遇龙河的运营状态和恢复方案</title><desc id="desc">编辑流程图将两套运营体系分开，水上项目失败后分别转向已确认的交通或陆地景观方案。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2e8"/><stop offset="1" stop-color="#e0ece8"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#516866"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b3c3d" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="92" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="45" font-weight="700" fill="#193f41">同一天气 · 两套独立运营系统</text><text x="800" y="140" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="26" fill="#536d6b">一条河的决定，不能证明另一条河的状态</text>
  <g filter="url(#shadow)"><rect x="110" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#3e7890" stroke-width="5"/><rect x="920" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#668657" stroke-width="5"/><rect x="110" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/><rect x="920" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/></g>
  <g font-family="'Noto Sans SC',Arial,sans-serif" text-anchor="middle"><text x="395" y="285" font-size="37" font-weight="700" fill="#28576b">核验漓江</text><text x="395" y="335" font-size="25" fill="#50696c">官方订单 · 海事通知</text><text x="395" y="374" font-size="25" fill="#50696c">分配港口 · 产品方向</text><text x="1205" y="285" font-size="37" font-weight="700" fill="#48693c">核验遇龙河</text><text x="1205" y="335" font-size="25" fill="#50696c">运营方／码头状态</text><text x="1205" y="374" font-size="25" fill="#50696c">线路 · 乘员资格</text>
  <text x="395" y="638" font-size="31" font-weight="700" fill="#76502e">漓江产品不能运行时</text><text x="395" y="682" font-size="23" fill="#5a6663">大型游船 → 先保住城市间移动</text><text x="395" y="720" font-size="23" fill="#5a6663">纯电排筏 → 保住指定河段主题</text><text x="395" y="758" font-size="23" fill="#5a6663">再选择核实过的陆地景观</text><text x="1205" y="655" font-size="34" font-weight="700" fill="#76502e">遇龙河不能运行时</text><text x="1205" y="705" font-size="25" fill="#5a6663">保留适合自己的乡村陆地段</text><text x="1205" y="745" font-size="25" fill="#5a6663">或重新核验另一条官方线路</text></g>
  <path d="M395 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M1205 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M680 315H900" stroke="#9aaaa7" stroke-width="4" stroke-dasharray="15 16"/><text x="790" y="300" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="22" fill="#6f817f">分别核验</text>
  <text x="800" y="888" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="29" font-weight="700" fill="#193f41">不用非官方竹筏 · 不借他人证件 · 不猜退款结果</text><text x="800" y="935" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="23" fill="#617370">Homeground编辑恢复模型 · 不是官方流程图、线路图或运营承诺</text>
</svg>
