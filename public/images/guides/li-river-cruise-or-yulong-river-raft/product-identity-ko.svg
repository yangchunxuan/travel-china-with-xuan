<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">리강 유람선과 위룽허 뗏목 질문 뒤의 세 상품</title><desc id="desc">리강 대형 유람선, 리강 순수 전동 관광 뗏목, 위룽허 수동 뗏목을 나눈 편집 도식입니다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0e6"/><stop offset="1" stop-color="#dfece8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173c40" flood-opacity=".14"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="105" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="47" font-weight="700" fill="#173c40">검색어 하나 · 실제 상품은 세 가지</text><text x="800" y="158" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="27" fill="#4c6665">비교 전에 강·동력·승선 지점·하선 지점을 확인하세요</text>
  <g filter="url(#shadow)"><rect x="80" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#527f91" stroke-width="5"/><rect x="575" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#3a8491" stroke-width="5"/><rect x="1070" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#668657" stroke-width="5"/></g>
  <g font-family="'Noto Sans KR',Arial,sans-serif" text-anchor="middle">
    <circle cx="305" cy="350" r="82" fill="#527f91"/><path d="M235 357h140l-18 38H253z" fill="#fff"/><rect x="267" y="312" width="76" height="45" rx="8" fill="#fff"/><path d="M278 323h20v17h-20zm34 0h20v17h-20z" fill="#527f91"/><text x="305" y="490" font-size="36" font-weight="700" fill="#244a58">리강 대형 유람선</text><text x="305" y="580" font-size="25" fill="#53686d">선실 · 긴 강줄기</text><text x="305" y="625" font-size="25" fill="#53686d">지정 항구 → 지정 부두</text><text x="305" y="710" font-size="23" font-weight="700" fill="#916b34">리강 운영 체계</text>
    <circle cx="800" cy="350" r="82" fill="#3a8491"/><path d="M720 365h160l-25 34H745z" fill="#fff"/><path d="M760 330h80" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M800 310v55" stroke="#fff" stroke-width="10"/><text x="800" y="490" font-size="36" font-weight="700" fill="#215361">리강 전동 뗏목</text><text x="800" y="580" font-size="25" fill="#53686d">개방형 · 지정 강 구간</text><text x="800" y="625" font-size="25" fill="#53686d">편도 또는 왕복</text><text x="800" y="710" font-size="23" font-weight="700" fill="#916b34">리강 운영 체계</text>
    <circle cx="1295" cy="350" r="82" fill="#668657"/><path d="M1215 370h160l-24 30h-112z" fill="#fff"/><path d="M1348 290l-95 158" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="1295" y="490" font-size="34" font-weight="700" fill="#3d5c33">위룽허 수동 뗏목</text><text x="1295" y="580" font-size="25" fill="#53686d">개방형 · 지정 선착장</text><text x="1295" y="625" font-size="25" fill="#53686d">노선별 규정</text><text x="1295" y="710" font-size="23" font-weight="700" fill="#55723f">위룽허 운영 체계</text>
  </g><text x="800" y="885" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="30" font-weight="700" fill="#173c40">지도 아님 · 축척 없음 · 시간표 아님</text><text x="800" y="930" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="24" fill="#5f7370">상품부터 확인하고 가격·잔여 좌석은 실시간 공식 채널에서 확인</text>
</svg>
