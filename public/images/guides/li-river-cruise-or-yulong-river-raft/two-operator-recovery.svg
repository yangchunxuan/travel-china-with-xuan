<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Separate Li River and Yulong River status checks and recoveries</title>
  <desc id="desc">An editorial flow keeps the two operating systems separate, then routes a failed water product toward verified movement or land-based scenery.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2e8"/><stop offset="1" stop-color="#e0ece8"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#516866"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b3c3d" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#193f41">ONE WEATHER DAY · TWO OPERATING SYSTEMS</text><text x="800" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#536d6b">A decision for one river never proves the status of the other</text>
  <g filter="url(#shadow)"><rect x="110" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#3e7890" stroke-width="5"/><rect x="920" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#668657" stroke-width="5"/><rect x="110" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/><rect x="920" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="395" y="285" font-size="37" font-weight="700" fill="#28576b">LI RIVER CHECK</text><text x="395" y="335" font-size="25" fill="#50696c">official order · maritime notice</text><text x="395" y="374" font-size="25" fill="#50696c">assigned port · product direction</text><text x="1205" y="285" font-size="37" font-weight="700" fill="#48693c">YULONG CHECK</text><text x="1205" y="335" font-size="25" fill="#50696c">operator / wharf status</text><text x="1205" y="374" font-size="25" fill="#50696c">route · passenger eligibility</text>
  <text x="395" y="638" font-size="31" font-weight="700" fill="#76502e">IF A LI PRODUCT CANNOT RUN</text><text x="395" y="682" font-size="23" fill="#5a6663">large cruise → protect city movement</text><text x="395" y="720" font-size="23" fill="#5a6663">electric raft → protect the named section</text><text x="395" y="758" font-size="23" fill="#5a6663">then choose verified land scenery</text><text x="1205" y="655" font-size="34" font-weight="700" fill="#76502e">IF YULONG CANNOT RUN</text><text x="1205" y="705" font-size="25" fill="#5a6663">keep a suitable countryside land block</text><text x="1205" y="745" font-size="25" fill="#5a6663">or choose another verified official route</text></g>
  <path d="M395 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M1205 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M680 315H900" stroke="#9aaaa7" stroke-width="4" stroke-dasharray="15 16"/><text x="790" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6f817f">CHECK SEPARATELY</text>
  <text x="800" y="888" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#193f41">NO UNOFFICIAL RAFT · NO BORROWED ID · NO ASSUMED REFUND</text><text x="800" y="935" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#617370">Editorial recovery model · not an official flowchart, route map or operating promise</text>
</svg>
