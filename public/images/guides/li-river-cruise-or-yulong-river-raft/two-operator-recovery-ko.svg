<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">리강과 위룽허 운항 상태 및 회복안을 따로 확인하기</title><desc id="desc">두 운영 체계를 분리하고 수상 상품이 실패하면 확인된 이동 또는 육상 경관 대안으로 연결하는 편집 흐름도입니다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2e8"/><stop offset="1" stop-color="#e0ece8"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#516866"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b3c3d" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="92" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="45" font-weight="700" fill="#193f41">같은 날씨 · 서로 다른 두 운영 체계</text><text x="800" y="140" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="26" fill="#536d6b">한 강의 결정이 다른 강의 상태를 증명하지 않습니다</text>
  <g filter="url(#shadow)"><rect x="110" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#3e7890" stroke-width="5"/><rect x="920" y="215" width="570" height="205" rx="32" fill="#fffdf8" stroke="#668657" stroke-width="5"/><rect x="110" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/><rect x="920" y="585" width="570" height="205" rx="32" fill="#fffdf8" stroke="#b37d46" stroke-width="5"/></g>
  <g font-family="'Noto Sans KR',Arial,sans-serif" text-anchor="middle"><text x="395" y="285" font-size="37" font-weight="700" fill="#28576b">리강 확인</text><text x="395" y="335" font-size="25" fill="#50696c">공식 주문 · 해사 공지</text><text x="395" y="374" font-size="25" fill="#50696c">배정 항구 · 상품 방향</text><text x="1205" y="285" font-size="37" font-weight="700" fill="#48693c">위룽허 확인</text><text x="1205" y="335" font-size="25" fill="#50696c">운영사／선착장 상태</text><text x="1205" y="374" font-size="25" fill="#50696c">노선 · 승객 탑승 기준</text>
  <text x="395" y="638" font-size="31" font-weight="700" fill="#76502e">리강 상품 운항 불가 시</text><text x="395" y="682" font-size="23" fill="#5a6663">대형 유람선 → 도시 간 이동 보호</text><text x="395" y="720" font-size="23" fill="#5a6663">전기 뗏목 → 지정 구간 주제 보호</text><text x="395" y="758" font-size="23" fill="#5a6663">확인된 육상 경관으로 전환</text><text x="1205" y="655" font-size="34" font-weight="700" fill="#76502e">위룽허 운항 불가 시</text><text x="1205" y="705" font-size="25" fill="#5a6663">맞는 전원 육상 코스를 유지하거나</text><text x="1205" y="745" font-size="25" fill="#5a6663">다른 공식 노선을 처음부터 재확인</text></g>
  <path d="M395 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M1205 420V560" stroke="#516866" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M680 315H900" stroke="#9aaaa7" stroke-width="4" stroke-dasharray="15 16"/><text x="790" y="300" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="22" fill="#6f817f">따로 확인</text>
  <text x="800" y="888" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="29" font-weight="700" fill="#193f41">비공식 뗏목 금지 · 타인 신분증 금지 · 환불 추정 금지</text><text x="800" y="935" text-anchor="middle" font-family="'Noto Sans KR',Arial,sans-serif" font-size="23" fill="#617370">Homeground 편집 회복 모델 · 공식 절차도·노선도·운항 보장 아님</text>
</svg>
