<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">“漓江游船还是遇龙河竹筏”背后的三种产品</title><desc id="desc">编辑示意图分别展示漓江大型游船、漓江纯电排筏和遇龙河人工撑篙竹筏。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0e6"/><stop offset="1" stop-color="#dfece8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173c40" flood-opacity=".14"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="105" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="48" font-weight="700" fill="#173c40">一个搜索问法 · 三种不同产品</text><text x="800" y="158" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="27" fill="#4c6665">比较前先确认河流、动力、上筏点与下筏点</text>
  <g filter="url(#shadow)"><rect x="80" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#527f91" stroke-width="5"/><rect x="575" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#3a8491" stroke-width="5"/><rect x="1070" y="225" width="450" height="570" rx="34" fill="#fffdf7" stroke="#668657" stroke-width="5"/></g>
  <g font-family="'Noto Sans SC',Arial,sans-serif" text-anchor="middle">
    <circle cx="305" cy="350" r="82" fill="#527f91"/><path d="M235 357h140l-18 38H253z" fill="#fff"/><rect x="267" y="312" width="76" height="45" rx="8" fill="#fff"/><path d="M278 323h20v17h-20zm34 0h20v17h-20z" fill="#527f91"/><text x="305" y="495" font-size="39" font-weight="700" fill="#244a58">漓江大型游船</text><text x="305" y="580" font-size="27" fill="#53686d">船舱 · 长距离河道</text><text x="305" y="625" font-size="27" fill="#53686d">指定港口 → 指定码头</text><text x="305" y="710" font-size="25" font-weight="700" fill="#916b34">漓江运营体系</text>
    <circle cx="800" cy="350" r="82" fill="#3a8491"/><path d="M720 365h160l-25 34H745z" fill="#fff"/><path d="M760 330h80" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M800 310v55" stroke="#fff" stroke-width="10"/><text x="800" y="495" font-size="39" font-weight="700" fill="#215361">漓江纯电排筏</text><text x="800" y="580" font-size="27" fill="#53686d">开放式 · 指定河段</text><text x="800" y="625" font-size="27" fill="#53686d">单程或往返</text><text x="800" y="710" font-size="25" font-weight="700" fill="#916b34">漓江运营体系</text>
    <circle cx="1295" cy="350" r="82" fill="#668657"/><path d="M1215 370h160l-24 30h-112z" fill="#fff"/><path d="M1348 290l-95 158" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="1295" y="495" font-size="39" font-weight="700" fill="#3d5c33">遇龙河人工竹筏</text><text x="1295" y="580" font-size="27" fill="#53686d">开放式 · 指定码头</text><text x="1295" y="625" font-size="27" fill="#53686d">线路规则各不相同</text><text x="1295" y="710" font-size="25" font-weight="700" fill="#55723f">遇龙河运营体系</text>
  </g><text x="800" y="885" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="30" font-weight="700" fill="#173c40">不是地图 · 不按比例 · 不是时刻表</text><text x="800" y="930" text-anchor="middle" font-family="'Noto Sans SC',Arial,sans-serif" font-size="24" fill="#5f7370">先确认产品身份；价格与余位以当期官方渠道为准</text>
</svg>
