<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Zhangjiajie arrive, stay and depart decision card</title>
  <desc id="desc">A schematic card distinguishing Zhangjiajie city, Wulingyuan and separate mountain-area anchors.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a74731"/></marker></defs>
  <rect width="1200" height="675" fill="#faf9f5"/><rect width="1200" height="12" fill="#a74731"/>
  <text x="64" y="72" fill="#7f2e1d" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">HOMEGROUND CHINA · CITY CARD 07</text>
  <text x="64" y="136" fill="#141413" font-family="Georgia, serif" font-size="56">Zhangjiajie · 张家界</text>
  <text x="64" y="174" fill="#5f5f5a" font-family="Arial, sans-serif" font-size="21">Choose the sleep location from tomorrow's confirmed sight—not the city label.</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="226" width="300" height="232" rx="8" fill="#fff" stroke="#d8d8d1"/>
    <text x="92" y="270" fill="#a74731" font-size="17" font-weight="700" letter-spacing="2">ARRIVE</text>
    <text x="92" y="316" fill="#141413" font-size="25" font-weight="700">DYG · West station</text><text x="92" y="350" fill="#141413" font-size="25" font-weight="700">City railway station</text>
    <text x="92" y="399" fill="#5f5f5a" font-size="18">All are city-side gateways.</text>
    <line x1="380" y1="342" x2="432" y2="342" stroke="#a74731" stroke-width="4" marker-end="url(#a)"/>
    <rect x="450" y="226" width="300" height="232" rx="8" fill="#141413"/>
    <text x="478" y="270" fill="#b0aea5" font-size="17" font-weight="700" letter-spacing="2">STAY</text>
    <text x="478" y="320" fill="#faf9f5" font-size="27" font-weight="700">City for Tianmen /</text><text x="478" y="356" fill="#faf9f5" font-size="27" font-weight="700">Wulingyuan for park</text>
    <text x="478" y="400" fill="#b0aea5" font-size="18">At most one deliberate move</text>
    <line x1="766" y1="342" x2="818" y2="342" stroke="#a74731" stroke-width="4" marker-end="url(#a)"/>
    <rect x="836" y="226" width="300" height="232" rx="8" fill="#fff" stroke="#d8d8d1"/>
    <text x="864" y="270" fill="#a74731" font-size="17" font-weight="700" letter-spacing="2">DEPART</text>
    <text x="864" y="316" fill="#141413" font-size="24" font-weight="700">Protect the named</text><text x="864" y="350" fill="#141413" font-size="24" font-weight="700">flight or rail node</text>
    <text x="864" y="399" fill="#5f5f5a" font-size="18">City last night can lower risk.</text>
  </g>
  <rect x="64" y="500" width="1072" height="92" rx="8" fill="#f2e7de"/>
  <text x="92" y="538" fill="#7f2e1d" font-family="Arial, sans-serif" font-size="17" font-weight="700">WRONG-NODE WARNING</text>
  <text x="92" y="570" fill="#141413" font-family="Arial, sans-serif" font-size="20">Tianmen Mountain, Forest Park gates and Grand Canyon are separate anchors; avoid daily ping-pong.</text>
  <text x="64" y="635" fill="#5f5f5a" font-family="Arial, sans-serif" font-size="16">Schematic, not to scale · Version 1.0 · CC BY 4.0 · Reviewed 23 Aug 2026 · homegroundchina.com</text>
</svg>
