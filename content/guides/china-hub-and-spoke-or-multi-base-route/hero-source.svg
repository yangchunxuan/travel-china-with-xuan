<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a9d8f"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#173f4b"/>
  <circle cx="1450" cy="80" r="250" fill="#e9c46a" opacity=".17"/>
  <circle cx="90" cy="930" r="260" fill="#2a9d8f" opacity=".13"/>
  <rect x="92" y="86" width="260" height="20" rx="10" fill="#ffffff" opacity=".88"/>
  <rect x="92" y="124" width="150" height="16" rx="8" fill="#ffffff" opacity=".38"/>

  <g fill="#ffffff" opacity=".055" stroke="#ffffff" stroke-opacity=".13" stroke-width="3">
    <rect x="70" y="190" width="700" height="320" rx="42"/>
    <rect x="830" y="190" width="700" height="320" rx="42"/>
    <rect x="70" y="550" width="700" height="320" rx="42"/>
    <rect x="830" y="550" width="700" height="320" rx="42"/>
  </g>

  <!-- Day-trip spoke: the room remains fixed and the traveller returns. -->
  <g fill="none" stroke="#2a9d8f" stroke-width="18" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M255 350 C330 245 485 245 570 344"/>
    <path d="M570 390 C485 485 330 485 255 390"/>
  </g>
  <g stroke="#173f4b" stroke-width="14">
    <rect x="183" y="300" width="118" height="118" rx="26" fill="#e9c46a"/>
    <circle cx="612" cy="368" r="62" fill="#ffffff"/>
  </g>
  <circle cx="242" cy="359" r="22" fill="#173f4b" opacity=".52"/>
  <path d="M213 392h58" stroke="#173f4b" stroke-width="13" stroke-linecap="round" opacity=".52"/>

  <!-- One-night bridge: one deliberate cross-night node between bases. -->
  <path d="M944 371 H1412" stroke="#2a9d8f" stroke-width="24" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g stroke="#173f4b" stroke-width="14">
    <circle cx="955" cy="371" r="58" fill="#ffffff"/>
    <circle cx="1180" cy="371" r="78" fill="#e9c46a"/>
    <circle cx="1412" cy="371" r="58" fill="#ffffff"/>
  </g>
  <path d="M1202 319a55 55 0 1 0 0 104a66 66 0 1 1 0-104z" fill="#173f4b" opacity=".72"/>

  <!-- True base: several independent priorities start from one room. -->
  <g fill="none" stroke="#2a9d8f" stroke-width="20" stroke-linecap="round">
    <path d="M420 708L225 641"/>
    <path d="M420 708L225 795"/>
    <path d="M420 708L635 645"/>
  </g>
  <g stroke="#173f4b" stroke-width="14">
    <rect x="348" y="636" width="144" height="144" rx="34" fill="#e9c46a"/>
    <circle cx="205" cy="634" r="54" fill="#ffffff"/>
    <circle cx="205" cy="803" r="54" fill="#ffffff"/>
    <circle cx="655" cy="638" r="54" fill="#ffffff"/>
  </g>
  <circle cx="420" cy="698" r="25" fill="#173f4b" opacity=".52"/>
  <path d="M386 737h68" stroke="#173f4b" stroke-width="14" stroke-linecap="round" opacity=".52"/>

  <!-- Remove: a weak branch is visibly detached from the forward chain. -->
  <path d="M942 730H1395" stroke="#2a9d8f" stroke-width="24" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1170 730L1292 825" stroke="#e76f51" stroke-width="17" stroke-dasharray="22 20" stroke-linecap="round"/>
  <g stroke="#173f4b" stroke-width="14" fill="#ffffff">
    <circle cx="955" cy="730" r="55"/>
    <circle cx="1170" cy="730" r="55"/>
    <circle cx="1400" cy="730" r="55"/>
    <circle cx="1310" cy="840" r="54" fill="#f6eee4"/>
  </g>
  <g stroke="#e76f51" stroke-width="20" stroke-linecap="round">
    <path d="M1278 808l64 64"/>
    <path d="M1342 808l-64 64"/>
  </g>
</svg>
