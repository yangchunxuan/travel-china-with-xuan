<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The fourth-stop test for adding Guilin and Yangshuo</title>
  <desc id="desc">An editorial decision diagram showing the Beijing, Xi'an and Shanghai route spine beside a Guilin and Yangshuo module that must pass value, usable-block and recovery tests.</desc>
  <rect width="1600" height="1000" fill="#f4efe5"/>
  <rect x="72" y="68" width="1456" height="864" rx="36" fill="#fffdf8" stroke="#183d3d" stroke-width="5"/>
  <text x="126" y="150" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="4" fill="#b04a2f">THE FOURTH-STOP TEST</text>
  <text x="126" y="218" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#183d3d">Does the landscape module earn its transfers?</text>
  <text x="126" y="267" font-family="Arial, sans-serif" font-size="25" fill="#506565">Decision diagram — not a map, timetable or day-by-day route</text>

  <text x="126" y="354" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#183d3d">CONFIRMED ROUTE SPINE</text>
  <line x1="206" y1="446" x2="920" y2="446" stroke="#183d3d" stroke-width="12" stroke-linecap="round"/>
  <circle cx="206" cy="446" r="50" fill="#d9e8df" stroke="#183d3d" stroke-width="5"/>
  <circle cx="562" cy="446" r="50" fill="#d9e8df" stroke="#183d3d" stroke-width="5"/>
  <circle cx="920" cy="446" r="50" fill="#d9e8df" stroke="#183d3d" stroke-width="5"/>
  <text x="206" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d3d">BEIJING</text>
  <text x="562" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d3d">XI'AN</text>
  <text x="920" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183d3d">SHANGHAI</text>

  <path d="M562 506 C562 590 675 602 675 675" fill="none" stroke="#b04a2f" stroke-width="8" stroke-dasharray="18 14"/>
  <path d="M675 675 C675 602 920 590 920 506" fill="none" stroke="#b04a2f" stroke-width="8" stroke-dasharray="18 14"/>
  <rect x="445" y="642" width="458" height="206" rx="30" fill="#183d3d"/>
  <text x="674" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#fffdf8">GUILIN / YANGSHUO</text>
  <text x="674" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#cde1d6">one regional landscape module</text>
  <text x="674" y="803" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fffdf8">entry chain + protected experience + exit chain</text>

  <rect x="1010" y="338" width="438" height="510" rx="28" fill="#f0e5d6" stroke="#b04a2f" stroke-width="4"/>
  <text x="1054" y="402" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#b04a2f">KEEP IT ONLY IF ALL 3 PASS</text>
  <circle cx="1068" cy="480" r="25" fill="#b04a2f"/>
  <text x="1068" y="489" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fffdf8">1</text>
  <text x="1110" y="477" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183d3d">Distinct value</text>
  <text x="1110" y="510" font-family="Arial, sans-serif" font-size="19" fill="#506565">The karst landscape</text>
  <text x="1110" y="536" font-family="Arial, sans-serif" font-size="19" fill="#506565">must change the trip.</text>
  <circle cx="1068" cy="596" r="25" fill="#b04a2f"/>
  <text x="1068" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fffdf8">2</text>
  <text x="1110" y="593" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183d3d">Usable block</text>
  <text x="1110" y="626" font-family="Arial, sans-serif" font-size="19" fill="#506565">Arrival and departure</text>
  <text x="1110" y="652" font-family="Arial, sans-serif" font-size="19" fill="#506565">cannot consume it.</text>
  <circle cx="1068" cy="712" r="25" fill="#b04a2f"/>
  <text x="1068" y="721" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fffdf8">3</text>
  <text x="1110" y="709" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183d3d">Recoverable exit</text>
  <text x="1110" y="742" font-family="Arial, sans-serif" font-size="19" fill="#506565">A failure cannot</text>
  <text x="1110" y="768" font-family="Arial, sans-serif" font-size="19" fill="#506565">endanger the flight.</text>
  <text x="1054" y="808" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#b04a2f">If one fails: cut the module.</text>

  <text x="126" y="899" font-family="Arial, sans-serif" font-size="24" fill="#506565">Homeground editorial framework · Verify actual airports, stations, operations and dates before booking.</text>
</svg>
