<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Language-neutral fourth-module decision diagram</title>
  <desc id="desc">A three-stop route spine sits above an optional landscape module. Three visual checks test distinct value, usable time and a recoverable exit. The illustration contains no visible words, map scale or timetable.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6eb"/>
      <stop offset="1" stop-color="#e8dfcf"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect x="74" y="70" width="1452" height="860" rx="42" fill="#fffdf8" stroke="#183d3d" stroke-width="6"/>

  <!-- Existing three-stop spine. Different symbols distinguish the nodes without language labels. -->
  <line x1="210" y1="345" x2="930" y2="345" stroke="#183d3d" stroke-width="14" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="210" cy="345" r="92" fill="#dcebe1" stroke="#183d3d" stroke-width="6"/>
    <circle cx="570" cy="345" r="92" fill="#dcebe1" stroke="#183d3d" stroke-width="6"/>
    <circle cx="930" cy="345" r="92" fill="#dcebe1" stroke="#183d3d" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#183d3d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M164 374 V326 H256 V374 M150 326 L210 278 L270 326"/>
    <path d="M522 374 H618 M536 374 V315 H604 V374 M522 315 L570 278 L618 315"/>
    <path d="M881 374 V302 H979 V374 M901 302 V274 H959 V302 M871 374 H989"/>
  </g>

  <!-- Optional landscape module, connected with a dashed detour rather than a fixed route. -->
  <path d="M570 444 C570 540 650 558 650 628" fill="none" stroke="#b34e34" stroke-width="10" stroke-linecap="round" stroke-dasharray="19 17"/>
  <path d="M650 628 C650 558 930 540 930 444" fill="none" stroke="#b34e34" stroke-width="10" stroke-linecap="round" stroke-dasharray="19 17"/>
  <g filter="url(#shadow)">
    <rect x="385" y="610" width="560" height="245" rx="40" fill="#183d3d"/>
  </g>
  <g transform="translate(665 732)">
    <circle cx="-150" cy="-52" r="28" fill="#efb552"/>
    <path d="M-224 63 L-112 -83 L-32 18 L32 -55 L142 63 Z" fill="#81ab91"/>
    <path d="M-248 75 C-164 30-96 108-16 62 C56 21 116 78 206 38" fill="none" stroke="#c8e5db" stroke-width="13" stroke-linecap="round"/>
    <path d="M-240 108 C-159 65-94 139-13 96 C60 57 125 111 215 73" fill="none" stroke="#6aafa8" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Three independent gates: distinct value, usable block and recoverable exit. -->
  <g transform="translate(1095 220)" filter="url(#shadow)">
    <rect width="330" height="635" rx="38" fill="#f1e5d6" stroke="#b34e34" stroke-width="5"/>
  </g>
  <g transform="translate(1260 345)">
    <circle cx="0" cy="0" r="66" fill="#b34e34"/>
    <path d="M-29 0 l20 21 42-49" fill="none" stroke="#fffdf8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 66 V116" stroke="#b34e34" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="183" r="66" fill="#b34e34"/>
    <path d="M-29 183 l20 21 42-49" fill="none" stroke="#fffdf8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 249 V299" stroke="#b34e34" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="366" r="66" fill="#b34e34"/>
    <path d="M-29 366 l20 21 42-49" fill="none" stroke="#fffdf8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#183d3d" opacity="0.86">
    <path d="M1151 338 l22-22 22 22-22 22z"/>
    <path d="M1147 528 h52 v52 h-52z"/>
    <path d="M1173 688 l31 54h-62z"/>
  </g>

  <!-- Recovery line returns to the route spine; it is deliberately not a geographic path. -->
  <path d="M945 822 C1018 822 1038 771 1088 771" fill="none" stroke="#183d3d" stroke-width="10" stroke-linecap="round"/>
  <path d="M1080 751 l35 20-35 20z" fill="#183d3d"/>
</svg>
