<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Shanghai Hangzhou Huangshan route dependency diagram</title>
  <desc id="desc">An editorial diagram showing a gateway lock, a city hinge and a mountain access chain. It is not to scale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2030"/>
      <stop offset="0.52" stop-color="#153f48"/>
      <stop offset="1" stop-color="#6b5a36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#07131b" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 748 C250 618 410 704 620 580 C820 462 997 514 1180 386 C1338 276 1444 306 1600 214 L1600 1000 L0 1000 Z" fill="#d0ad64" opacity="0.12"/>
  <g fill="none" stroke="#f0d89f" stroke-width="12" stroke-linecap="round" opacity="0.88">
    <path d="M300 510 H650"/>
    <path d="M950 510 H1300"/>
  </g>
  <g fill="#f0d89f">
    <path d="M646 510 l-36 -23 v46 z"/>
    <path d="M1296 510 l-36 -23 v46 z"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="310" width="320" height="390" rx="34" fill="#f4eee2"/>
    <rect x="640" y="310" width="320" height="390" rx="34" fill="#e8f1e9"/>
    <rect x="1185" y="310" width="320" height="390" rx="34" fill="#f3e7ca"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="255" y="420" font-size="34" font-weight="700" fill="#152d3a">GATEWAY LOCK</text>
    <text x="255" y="485" font-size="24" fill="#38505b">airport · ticket · buffer</text>
    <circle cx="255" cy="585" r="50" fill="#1b6573"/>
    <path d="M232 585 h46 M255 562 v46" stroke="#f4eee2" stroke-width="9" stroke-linecap="round"/>

    <text x="800" y="420" font-size="34" font-weight="700" fill="#1f463c">HANGZHOU HINGE</text>
    <text x="800" y="485" font-size="24" fill="#47665f">protected stay or remove</text>
    <path d="M735 590 q65 -100 130 0 q-65 74 -130 0" fill="#4e8b75"/>
    <circle cx="800" cy="575" r="20" fill="#e8f1e9"/>

    <text x="1345" y="420" font-size="34" font-weight="700" fill="#574625">MOUNTAIN LOCK</text>
    <text x="1345" y="485" font-size="24" fill="#77643a">road · gate · shuttle · path</text>
    <path d="M1255 625 l74 -122 40 62 38 -48 72 108 z" fill="#9b7d3f"/>
    <path d="M1310 535 l19 -32 13 20" fill="none" stroke="#f3e7ca" stroke-width="8"/>
  </g>
  <text x="110" y="865" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5e7c5">ORDER THE DEPENDENCIES, THEN SEARCH THE DATED TRANSPORT</text>
  <text x="110" y="915" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d1c5a7">Editorial decision diagram · not a map · no timetable or duration claim</text>
</svg>
