<title>Homeground Menu Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR&family=Noto+Serif+SC&display=swap">
<style>
/* Layout: the site's real header stays put; below it the menu opens as oversized serif words that unfold in place. Framed on desktop, full-bleed on phones. */
:root {
  --ink: #141413;
  --muted: #6b6b66;
  --faint: #a9a7a0;
  --dim: #938f87;
  --line: #e7e5df;
  --white: #ffffff;
  --rust: #a74731;
  --rust-light: #e0a58f;
  --chrome: #ecebe6;
  --bezel: #d9d7d0;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Apple SD Gothic Neo", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--chrome); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
button:focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; border-radius: 4px; }
ul { list-style: none; margin: 0; padding: 0; }

.app { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 18px 26px; padding-inline: 16px; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; max-width: 760px; }
.seg { display: flex; background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 540px; line-height: 1.55; }

.device { position: relative; width: 390px; height: 780px; max-width: 100%; box-sizing: border-box; border: 10px solid var(--bezel); border-radius: 46px; overflow: hidden; background: var(--white); box-shadow: 0 22px 54px rgb(20 20 19 / 12%); }
.device[data-lang="zh"] { --serif: "Noto Serif SC", "Songti SC", "STSong", serif; }
.device[data-lang="ko"] { --serif: "Noto Serif KR", "AppleMyungjo", serif; }
@media (max-width: 560px) {
  .app { padding: 0; gap: 0; }
  .controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; width: 100%; max-width: none; box-sizing: border-box; padding: 8px 10px; background: var(--chrome); }
  .hint { display: none; }
  .device { width: 100%; border: 0; border-radius: 0; box-shadow: none; }
}
.caps { font-family: var(--sans); text-transform: uppercase; letter-spacing: .16em; font-size: 10px; font-weight: 600; }

/* The site's own header, which stays in place when the menu opens */
.sh { position: absolute; z-index: 4; inset: 0 0 auto; height: 68px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--white); border-bottom: 1px solid var(--line); transition: border-color .3s; }
.device.open .sh { border-bottom-color: transparent; }
.brand { display: flex; align-items: center; gap: 9px; }
.mark { width: 26px; height: 26px; position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; width: 11px; height: 21px; border-radius: 8px; transform: rotate(45deg); }
.mark::before { background: var(--rust); left: 4px; top: -2px; }
.mark::after { background: #d9a08e; left: 11px; top: 6px; }
.brand b { display: block; font-family: Georgia, serif; font-size: 17px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 7.5px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin-top: 3px; }
.sh-r { display: flex; gap: 8px; align-items: center; }
.plan { background: var(--ink); color: var(--white); border-radius: 999px; padding: 11px 17px; font-size: 14px; font-weight: 700; transition: opacity .25s, transform .25s var(--ease); }
.device.open .plan { opacity: 0; transform: translateX(6px); pointer-events: none; }
.burger { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; position: relative; }
.burger span { position: absolute; left: 13px; width: 18px; height: 1.6px; background: var(--ink); border-radius: 2px; transition: transform .35s var(--ease), opacity .2s; }
.burger span:nth-child(1) { top: 15.5px; } .burger span:nth-child(2) { top: 20.5px; } .burger span:nth-child(3) { top: 25.5px; }
.device.open .burger span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.device.open .burger span:nth-child(2) { opacity: 0; }
.device.open .burger span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

.site { position: absolute; inset: 0; overflow: hidden; background: var(--white); }
.hero { padding: 122px 24px 0; text-align: center; }
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.12; letter-spacing: -.02em; margin: 0; }
.hero p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 18px auto 0; max-width: 300px; }
.hero .pic { margin: 30px auto 0; height: 230px; border-radius: 18px; background: #ddd center/cover; }

/* Menu */
.menu { position: absolute; z-index: 3; inset: 68px 0 0; display: flex; flex-direction: column; background: var(--white); opacity: 0; transition: opacity .3s var(--ease); }
.menu[hidden] { display: none; }
.device.open .menu { opacity: 1; }
.m-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 22px 18px; overscroll-behavior: contain; }
.r { opacity: 0; transform: translateY(12px); transition: opacity .55s var(--ease), transform .55s var(--ease); transition-delay: calc(var(--i, 0) * 55ms + 90ms); }
.device.open .r { opacity: 1; transform: none; }

.sec-btn { display: block; width: 100%; }
.lab { background: linear-gradient(90deg, #d8d8d1, var(--rust) 70%, var(--rust-light)) no-repeat 0 96% / 0% 2px; transition: background-size .5s var(--ease), color .35s var(--ease); }
.sec.open .lab, .sec.current .lab { background-size: 100% 2px; }
.has-open .big .sec:not(.open) .lab { color: var(--dim); }
.has-open .small .sec:not(.open) .lab { color: var(--muted); }

.big .sec-btn { padding: 4px 0; }
.big .lab { font-family: var(--serif); font-size: clamp(36px, 11.2vw, 46px); letter-spacing: -.03em; line-height: 1.08; }
.device[data-lang="zh"] .big .lab { font-size: clamp(32px, 9.6vw, 40px); letter-spacing: .03em; line-height: 1.3; }
.device[data-lang="ko"] .big .lab { font-size: clamp(31px, 9.2vw, 39px); letter-spacing: -.01em; line-height: 1.3; }
.small { margin-top: 22px; display: grid; gap: 2px; }
.small .sec-btn { padding: 5px 0; }
.small .lab { font-family: var(--serif); font-size: 22px; letter-spacing: -.01em; line-height: 1.25; }
.device[data-lang="zh"] .small .lab { letter-spacing: .04em; }
.tag { margin: 30px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; max-width: 250px; }

.panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
.sec.open .panel { grid-template-rows: 1fr; }
.panel > div { overflow: hidden; }
.subs { display: grid; gap: 13px; padding: 12px 0 22px; }
.subs li { opacity: 0; transform: translateY(8px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
.sec.open .subs li { opacity: 1; transform: none; transition-duration: .5s; transition-delay: calc(var(--i, 0) * 50ms + 140ms); }
.sub { display: block; width: 100%; font-family: var(--serif); font-size: 20px; line-height: 1.22; letter-spacing: -.005em; }
.small .sub { font-size: 17px; }
.desc { display: block; font-family: var(--sans); font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 3px; letter-spacing: 0; }
.sub:hover .desc { color: var(--ink); }
.device[data-style="grid"] .subs { grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.device[data-style="grid"] .sub { font-size: 17px; }
.device[data-style="grid"] .desc { font-size: 11.5px; }

.m-foot { flex: none; margin: 0 22px; padding: 14px 0 4px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.cta-line { display: flex; justify-content: space-between; align-items: center; width: 100%; font-family: var(--serif); font-size: 18px; }
.longarrow { display: inline-block; width: 42px; height: 1px; background: currentColor; position: relative; transition: width .3s var(--ease); flex: none; }
.longarrow::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); }
.cta-line:hover .longarrow { width: 54px; }
/* Four endonyms in equal cells; each in its own script's face, optically matched. */
.lang-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 -4px; padding-top: 4px; border-top: 1px solid var(--line); }
.lang-row button { min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); text-align: center; transition: color .25s; }
.lang-row button::after { content: ""; width: 16px; height: 1.5px; border-radius: 1px; background: transparent; transition: background .3s; }
.lang-row button[aria-current="true"] { color: var(--ink); }
.lang-row button[aria-current="true"]::after { background: linear-gradient(90deg, #d8d8d1, var(--rust) 70%, var(--rust-light)); }
.lang-row button:hover { color: var(--ink); }
.lang-row :lang(en) { font: 500 13.5px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; letter-spacing: .01em; }
.lang-row :lang(zh) { font: 500 13px/1 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; letter-spacing: .04em; }
.lang-row :lang(ko) { font: 600 13.5px/1 "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: .02em; padding-top: 2px; }
.lang-row :lang(ja) { font: 500 13px/1 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; letter-spacing: .04em; }

.toast { position: absolute; z-index: 6; left: 50%; bottom: 18px; transform: translate(-50%, 8px); opacity: 0; transition: opacity .25s, transform .25s; background: var(--ink); color: var(--white); font-size: 12.5px; padding: 9px 14px; border-radius: 999px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; }
}
</style>

<div class="app">
  <div class="controls">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      <button type="button" data-lang="ko" aria-pressed="false">한국어</button>

    <div class="seg" role="group" aria-label="Expanded layout">
      <button type="button" data-style="list" aria-pressed="true">展开：列表</button>

    <div class="seg" role="group" aria-label="Current page">
      <button type="button" data-current="home" aria-pressed="true">在首页</button>

    cta: "중국 여행 플래너와 상담하기", tag: "실제 조건을 바탕으로 설계하는 맞춤 여행.",
    hero: "중국, 나만의 방식으로.", heroP: "원하는 여행에 가까운 일정을 고른 뒤, 실제 날짜에 맞춰 조정하세요.",
    toast: (l) => `프로토타입 · “${l}”(으)로 이동`,
    big: [
      { id: "destinations", label: "여행지", items: [["도시", "베이징·상하이·시안 등 8개 도시"], ["테마 여행", "테마로 고르는 추천 일정"], ["꼭 가볼 명소", "만리장성·병마용 등, 대부분 예약 대행 가능"]] },
      { id: "tours", label: "프라이빗 투어", items: [["프라이빗 투어 전체", "지역·기간·가격으로 전체 일정 찾기"], ["여러 도시 일주", "한 번에 여러 도시를 잇는 코스"], ["한 지역 깊이 보기", "동부·서남부·남부 등 한 지역만"], ["이번 시즌 추천", "겨울 동북: 하얼빈, 백두산"]] },
      { id: "services", label: "서비스", items: [["관광지 예약 대행", "공식 채널에서 본인 여권 실명으로 예약"], ["프라이빗 한국어 가이드", "상하이·베이징·시안·장가계, 하루 단위 예약"], ["차량·기사 및 픽업·샌딩", "공항·역 이동과 프라이빗 차량 일정"], ["전체 여행 설계 및 현지 지원", "숙소·이동·현지 준비까지 한 번에"]] },
    ],
    small: [
      { id: "guides", label: "실용 가이드", items: null },
      { id: "about", label: "회사 소개", items: [["사명과 가치", "Homeground가 하는 일과 약속"], ["여행 설계 방식", "Homeground가 현실적인 일정을 판단하는 법"], ["허가 및 등록 정보", "직접 확인할 수 있는 회사 등록 정보"]] },
    ],
  },
};

const state = { lang: "en", open: false, section: null };
const $ = (s, r = document) => r.querySelector(s);
const device = $("#device"), menu = $("#menu"), menuBtn = $("#menuBtn"), toastEl = $("#toast");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function section(s, i) {
  if (!s.items) return `<li class="sec r" style="--i:${i}" data-id="${s.id}"><button type="button" class="sec-btn" data-act="go" data-label="${esc(s.label)}"><span class="lab">${esc(s.label)}</span></button></li>`;
  return `<li class="sec r" style="--i:${i}" data-id="${s.id}">
    <button type="button" class="sec-btn" data-act="toggle" data-id="${s.id}" aria-expanded="false" aria-controls="panel-${s.id}"><span class="lab">${esc(s.label)}</span></button>
    <div class="panel" id="panel-${s.id}"><div><ul class="subs">${s.items.map(([l, d], j) => `<li style="--i:${j}"><button type="button" class="sub" data-act="go" data-label="${esc(l)}" tabindex="-1">${esc(l)}<span class="desc">${esc(d)}</span></button></li>`).join("")}</ul></div></div>
  </li>`;
}

function render() {
  const t = T[state.lang];
  device.dataset.lang = state.lang;
  $("#planBtn").textContent = t.plan;
  $("#heroH").textContent = t.hero;
  $("#heroP").textContent = t.heroP;
  menuBtn.setAttribute("aria-label", state.open ? t.close : t.open);
  menu.innerHTML = `
    <div class="m-scroll">
      <ul class="big">${t.big.map((s, i) => section(s, i)).join("")}</ul>
      <ul class="small">${[...t.small, { id: "faq", label: t.faq, items: null }].map((s, i) => section(s, i + 3)).join("")}</ul>
      <p class="tag r" style="--i:7">${esc(t.tag)}</p>
    </div>
    <div class="m-foot r" style="--i:8">
      <button type="button" class="cta-line" data-act="cta">${esc(t.cta)}<span class="longarrow"></span></button>
      <div class="lang-row" role="group" aria-label="${esc(t.language)}">${[["en", "English"], ["zh", "中文"], ["ko", "한국어"], ["ja", "日本語"]].map(([k, l]) => `<button type="button" data-act="lang" data-lang="${k}" lang="${k}" aria-current="${k === state.lang}">${l}</button>`).join("")}</div>
    </div>`;
  markCurrent();
  setSection(state.section, false);
  document.querySelectorAll(".controls [data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function markCurrent() {
  menu.querySelectorAll(".sec").forEach((el) => {
    const cur = el.dataset.id === device.dataset.current;
    el.classList.toggle("current", cur);
    const btn = el.querySelector(".sec-btn");
    if (cur) btn.setAttribute("aria-current", "location"); else btn.removeAttribute("aria-current");
  });
}

/* One section open at a time; the open one keeps its colour and underline, the rest fade back. */
function setSection(id, scroll = true) {
  state.section = id;
  menu.querySelector(".m-scroll")?.classList.toggle("has-open", Boolean(id));
  menu.querySelectorAll(".sec").forEach((el) => {
    const open = el.dataset.id === id;
    el.classList.toggle("open", open);
    const btn = el.querySelector('[data-act="toggle"]');
    if (btn) btn.setAttribute("aria-expanded", String(open));
    el.querySelectorAll(".sub").forEach((s) => (s.tabIndex = open ? 0 : -1));
  });
  if (id && scroll) {
    const el = menu.querySelector(`.sec[data-id="${id}"]`), sc = menu.querySelector(".m-scroll");
    setTimeout(() => {
      const elBottom = el.offsetTop + el.offsetHeight, view = sc.scrollTop + sc.clientHeight;
      if (elBottom > view) sc.scrollTo({ top: Math.min(el.offsetTop - 12, elBottom - sc.clientHeight + 12), behavior: "smooth" });
    }, 260);
  }
}

function openMenu() {
  state.open = true; state.section = null; render();
  menu.hidden = false; menuBtn.setAttribute("aria-expanded", "true");
  requestAnimationFrame(() => requestAnimationFrame(() => device.classList.add("open")));
}
function closeMenu() {
  state.open = false; device.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-label", T[state.lang].open);
  setTimeout(() => { if (!state.open) { menu.hidden = true; state.section = null; } }, 300);
}
let toastTimer;
function toast(label) { toastText(T[state.lang].toast(label)); }
function toastText(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1700);
}

menu.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "toggle") setSection(state.section === b.dataset.id ? null : b.dataset.id);
  else if (act === "go") toast(b.dataset.label);
  else if (act === "cta") toast(T[state.lang].cta);
  else if (act === "faq") toast(T[state.lang].faq);
  else if (act === "lang") { if (b.dataset.lang === "ja") toastText(T[state.lang].jaNote); else { state.lang = b.dataset.lang; render(); } }
});
menuBtn.addEventListener("click", () => (state.open ? closeMenu() : openMenu()));
$("#planBtn").addEventListener("click", () => toast(T[state.lang].cta));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open) { closeMenu(); menuBtn.focus(); } });
document.querySelectorAll(".controls [data-lang]").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));
document.querySelectorAll(".controls [data-style]").forEach((b) => b.addEventListener("click", () => {
  device.dataset.style = b.dataset.style;
  document.querySelectorAll(".controls [data-style]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (!state.open) openMenu();
  if (!state.section) setSection("tours");
}));
document.querySelectorAll(".controls [data-current]").forEach((b) => b.addEventListener("click", () => {
  device.dataset.current = b.dataset.current;
  document.querySelectorAll(".controls [data-current]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (!state.open) openMenu(); else markCurrent();
}));

function fit() {
  if (window.matchMedia("(max-width: 560px)").matches) device.style.height = Math.max(520, window.innerHeight - $(".controls").offsetHeight) + "px";
  else device.style.height = "";
}
window.addEventListener("resize", fit);
render(); fit(); openMenu();
</script>
